pipeline:
  id: harness_pipeline_demo
  name: harness-pipeline-demo
  clone:
    enabled: true
    connector: github_connector
    repo: harness-project
    ref:
      type: branch
      name: main
  inputs:
    docker_user:
      type: string
      default: noman1213
      desc: Docker Hub username (image is pushed to <docker_user>/harness-demo)
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - name: Run Tests
          id: run_tests
          run:
            container:
              image: python:3.12-slim
            shell: sh
            script: |
              pip install -q -r requirements-dev.txt
              python -m pytest -q --junitxml=report.xml
            report:
              type: junit
              path: report.xml
        - name: Build and Push Image
          id: build_and_push
          run:
            shell: bash
            env:
              DOCKER_USER: <+inputs.docker_user>
              DOCKER_TOKEN: <+secrets.getValue("dockerhub_token")>
              BUILD_ID: <+pipeline.sequenceId>
            script: |
              set -e
              IMAGE="$DOCKER_USER/harness-demo"
              echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin
              docker build --build-arg APP_VERSION="build-$BUILD_ID" -t "$IMAGE:$BUILD_ID" -t "$IMAGE:latest" .
              docker push "$IMAGE:$BUILD_ID"
              docker push "$IMAGE:latest"
