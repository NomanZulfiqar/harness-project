pipeline:
  id: harness_demo_ci
  name: harness-demo-ci
  clone:
    enabled: true
    connector: github_connector
    repo: harness-project
    ref:
      type: branch
      name: main
  inputs:
    docker_user:
      type: string
      default: noman1213
      desc: Docker Hub username (image is pushed to <docker_user>/harness-demo)
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - name: Run Tests
          id: run_tests
          run:
            container: python:3.12-slim
            shell: sh
            script: |
              pip install -q -r requirements-dev.txt
              python -m pytest -q --junitxml=report.xml
            report:
              type: junit
              path: report.xml
        - name: Build and Push Image
          id: build_and_push
          uses: buildAndPushToDocker@1.0.0
          with:
            connector: dockerhub_connector
            repo: ${{ inputs.docker_user }}/harness-demo
            tags:
              - <+pipeline.sequenceId>
              - latest
            caching: false
            buildargs:
              APP_VERSION: build-<+pipeline.sequenceId>
