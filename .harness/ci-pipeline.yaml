# Harness CI pipeline: test -> build -> push to Docker Hub
# Runs on Harness Cloud build machines (no delegate / cluster needed).
#
# Before importing, make sure these identifiers match what you created in Harness:
#   orgIdentifier / projectIdentifier  -> your org + project
#   github_connector                   -> GitHub connector (Repository URL type)
#   dockerhub_connector                -> Docker Registry connector for Docker Hub
pipeline:
  name: harness-demo-ci
  identifier: harness_demo_ci
  orgIdentifier: default
  projectIdentifier: harness_lab
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github_connector
        build:
          type: branch
          spec:
            branch: main
  variables:
    - name: docker_user
      type: String
      description: Docker Hub username (image is pushed to <docker_user>/harness-demo)
      required: true
      value: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run Tests
                  identifier: run_tests
                  spec:
                    connectorRef: dockerhub_connector
                    image: python:3.12-slim
                    shell: Sh
                    command: |
                      pip install -q -r requirements-dev.txt
                      python -m pytest -q --junitxml=report.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - report.xml
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_and_push
                  spec:
                    connectorRef: dockerhub_connector
                    repo: <+pipeline.variables.docker_user>/harness-demo
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    buildArgs:
                      APP_VERSION: build-<+pipeline.sequenceId>
